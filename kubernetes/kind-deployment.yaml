apiVersion: v1
kind: Namespace
metadata:
  name: stream-sure
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: streamsure-data
  namespace: stream-sure
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamsure
  namespace: stream-sure
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: streamsure
  template:
    metadata:
      labels:
        app: streamsure
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: streamsure
          image: streamsure:1.0.3
          imagePullPolicy: IfNotPresent
          command: ["streamsure"]
          args: ["serve", "--host", "0.0.0.0", "--port", "8080", "--db", "/data/streamsure.db"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 20
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: streamsure-data
---
apiVersion: v1
kind: Service
metadata:
  name: streamsure
  namespace: stream-sure
spec:
  type: NodePort
  selector:
    app: streamsure
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
